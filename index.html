<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hub - All-in-One Utility Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand">⚡ SmartHub</div>
    <button class="nav-btn active" onclick="switchTab('calc-tab')">🧮 Super Calc</button>
    <button class="nav-btn" onclick="switchTab('music-tab')">🎵 Media Player</button>
    <button class="nav-btn" onclick="switchTab('todo-tab')">📝 Task & Notes</button>
    <button class="nav-btn" onclick="switchTab('timer-tab')">⏱️ Timer Focus</button>
  </aside>

  <!-- Main Content Dashboard -->
  <main class="content">

    <!-- TAB 1: KALKULATOR SUPER -->
    <section id="calc-tab" class="tab-content active">
      <div class="card">
        <h2>🧮 Super Calculator</h2>
        <div class="calc-display">
          <input type="text" id="calcScreen" readonly value="0">
        </div>
        <div class="calc-buttons">
          <button onclick="clearCalc()" class="btn-alt">C</button>
          <button onclick="appendCalc('(')">(</button>
          <button onclick="appendCalc(')')">)</button>
          <button onclick="appendCalc('/')" class="btn-op">÷</button>
          
          <button onclick="appendCalc('7')">7</button>
          <button onclick="appendCalc('8')">8</button>
          <button onclick="appendCalc('9')">9</button>
          <button onclick="appendCalc('*')" class="btn-op">×</button>
          
          <button onclick="appendCalc('4')">4</button>
          <button onclick="appendCalc('5')">5</button>
          <button onclick="appendCalc('6')">6</button>
          <button onclick="appendCalc('-')" class="btn-op">-</button>
          
          <button onclick="appendCalc('1')">1</button>
          <button onclick="appendCalc('2')">2</button>
          <button onclick="appendCalc('3')">3</button>
          <button onclick="appendCalc('+')" class="btn-op">+</button>
          
          <button onclick="appendCalc('0')">0</button>
          <button onclick="appendCalc('.')">.</button>
          <button onclick="calculateResult()" class="btn-action">=</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: PEMUTAR MUSIK & AMBIENT SOUND -->
    <section id="music-tab" class="tab-content">
      <div class="card">
        <h2>🎵 Local Music Player</h2>
        <input type="file" id="audioInput" accept="audio/*" class="file-input">
        <div class="player-controls">
          <p id="songTitle">Belum ada lagu dipilih</p>
          <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px;"></audio>
        </div>
      </div>
    </section>

    <!-- TAB 3: CATATAN & TO-DO LIST -->
    <section id="todo-tab" class="tab-content">
      <div class="card">
        <h2>📝 Fast Notes & Tasks</h2>
        <div class="input-group">
          <input type="text" id="taskInput" placeholder="Tambah tugas baru...">
          <button onclick="addTask()" class="btn-action">Tambah</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </div>
    </section>

    <!-- TAB 4: TIMER FOCUS (POMODORO) -->
    <section id="timer-tab" class="tab-content">
      <div class="card text-center">
        <h2>⏱️ Focus Timer</h2>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-controls">
          <button onclick="startTimer()" class="btn-action">Start</button>
          <button onclick="pauseTimer()" class="btn-alt">Pause</button>
          <button onclick="resetTimer()" class="btn-alt">Reset</button>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
